<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <!-- Blue Calligraphy Gradient -->
    <linearGradient id="ayurBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76BC21" />
      <stop offset="100%" stop-color="#4B8B14" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group Wrapper for Centering & Transparency -->
  <g filter="url(#subtleDrop)">
    <!-- 1. TOP BOTANICAL LEAF EMBLEM -->
    <g transform="translate(115, 12)">
      <!-- Main Green Leaf -->
      <path d="M 45 10 C 70 12 85 35 80 58 C 55 58 25 48 18 28 C 14 18 28 10 45 10 Z" fill="url(#leafGreen)" />
      <!-- Leaf Vein & Shadow -->
      <path d="M 45 10 Q 48 32 80 58" fill="none" stroke="#2D5A0B" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      
      <!-- Secondary Small Leaf -->
      <path d="M 22 42 C 6 38 2 20 15 12 C 22 20 30 38 22 42 Z" fill="url(#leafGreen)" opacity="0.9" />
      
      <!-- Top Green Dot -->
      <circle cx="52" cy="5" r="7" fill="url(#leafGreen)" />
    </g>

    <!-- 2. CALLIGRAPHY "Ayurmor" LOGO TEXT -->
    <g transform="translate(20, 80)">
      <!-- Custom Stylized Calligraphy Text -->
      <text x="5" y="45" font-family="'Brush Script MT', 'Palatino Linotype', 'Playfair Display', Georgia, serif" font-weight="900" font-size="52" fill="url(#ayurBlue)" letter-spacing="-0.5">
        Ayurmor
      </text>

      <!-- Stylized Swirl tail on Capital 'A' -->
      <path d="M 12 18 C -5 25 -8 45 5 52 C 15 56 22 45 18 35 Z" fill="url(#ayurBlue)" opacity="0.8" />
    </g>

    <!-- 3. GREEN UNDERLINE WITH DOT -->
    <g transform="translate(100, 138)">
      <!-- Line -->
      <line x1="0" y1="0" x2="165" y2="0" stroke="url(#leafGreen)" stroke-width="3.5" stroke-linecap="round" />
      <!-- End Dot -->
      <rect x="170" y="-3" width="5" height="5" fill="url(#leafGreen)" rx="1" />
    </g>
  </g>
</svg>
