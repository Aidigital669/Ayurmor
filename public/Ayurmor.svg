<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="450" height="110">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B" />
      <stop offset="50%" stop-color="#76BC21" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7977D" />
      <stop offset="100%" stop-color="#D47657" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A86B" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Emblem: Twin Botanical Leaves with Sun Dot -->
  <g transform="translate(10, 10)">
    <!-- Primary Leaf -->
    <path d="M 45 10 C 75 10 85 40 85 70 C 55 70 25 60 15 35 C 10 22 25 10 45 10 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />
    <!-- Leaf Vein -->
    <path d="M 45 10 Q 50 40 85 70" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <!-- Secondary Accent Leaf -->
    <path d="M 25 50 C 5 45 0 25 15 15 C 25 25 35 45 25 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Golden Vitality Spark Dot -->
    <circle cx="78" cy="22" r="5" fill="#E7977D" />
  </g>

  <!-- Typography: AYURMOR -->
  <text x="110" y="58" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="800" font-size="44" fill="#0A2540" letter-spacing="1">
    Ayur<tspan fill="#0080FF">mor</tspan>
  </text>

  <!-- Tagline -->
  <text x="112" y="82" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11.5" fill="#5A8B73" letter-spacing="2.5">
    NATURAL GOODNESS • INSTANT WELLNESS
  </text>
</svg>
